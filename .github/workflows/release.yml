name: Build release executables

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            executable: GoExport-GUI.exe
            archive: GoExport-GUI-windows-x64.zip
          - platform: Linux x64
            runner: ubuntu-22.04
            executable: GoExport-GUI
            archive: GoExport-GUI-linux-x64.zip
          - platform: macOS Intel
            runner: macos-15-intel
            executable: GoExport-GUI
            archive: GoExport-GUI-macos-intel.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Write release version
        shell: bash
        run: printf '%s\n' "$GITHUB_REF_NAME" > version.txt

      - name: Build executable
        run: >-
          python -m PyInstaller GoExport-GUI.spec --noconfirm --clean
          --distpath package --workpath build

      - name: Download pinned AppImage tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum --check
          chmod 755 appimagetool-x86_64.AppImage

      - name: Build portable Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool-x86_64.AppImage
        run: bash packaging/build_appimage.sh

      - name: Smoke test AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/GoExport-GUI-x86_64.AppImage --appimage-version

      - name: Create minimal release archive
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p release
          cp "package/$EXECUTABLE" "release/$EXECUTABLE"
          cp presets.toml release/presets.toml
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod 755 "release/$EXECUTABLE"
          fi
          export RELEASE_OS="$RUNNER_OS"
          python - <<'PY'
          import os
          import stat
          import zipfile

          executable = os.environ["EXECUTABLE"]
          archive = os.path.join("release", os.environ["ARCHIVE"])
          executable_mode = 0o755 if os.environ["RELEASE_OS"] != "Windows" else 0o644

          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
              for filename, mode in ((executable, executable_mode), ("presets.toml", 0o644)):
                  path = os.path.join("release", filename)
                  entry = zipfile.ZipInfo(filename)
                  entry.create_system = 3  # Unix: preserves the mode on extraction.
                  entry.external_attr = (stat.S_IFREG | mode) << 16
                  with open(path, "rb") as source:
                      output.writestr(entry, source.read(), compress_type=zipfile.ZIP_DEFLATED)
          PY
          rm "release/$EXECUTABLE" release/presets.toml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: GoExport-GUI-x86_64.AppImage
          path: dist/GoExport-GUI-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip release/*.AppImage --clobber
          else
            gh release create "$TAG" release/*.zip release/*.AppImage --generate-notes
          fi
